<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HaShira | ...was never silent</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel&family=Lora:italic,wght@0,400;1,400&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #080808; 
            color: #e0e0e0; 
            font-family: 'Lora', serif; 
            margin: 0; 
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container { 
            width: 90%;
            max-width: 600px;
            padding: 20px;
        }

        h1 { 
            font-family: 'Cinzel', serif; 
            font-size: clamp(2.5rem, 10vw, 4.5rem); 
            color: #d4af37; 
            margin: 0; 
            letter-spacing: 8px;
            font-weight: normal;
        }

        h2 { 
            font-weight: normal; 
            font-style: italic; 
            color: #a0a0a0; 
            margin-top: 10px;
            margin-bottom: 60px; 
            font-size: clamp(1.1rem, 4vw, 1.5rem);
            letter-spacing: 2px;
        }

        .status {
            font-size: 0.9rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 20px;
        }

        .contact-link { 
            display: inline-block;
            color: #d4af37; 
            text-decoration: none; 
            border: 1px solid #d4af37;
            padding: 12px 25px;
            transition: 0.4s; 
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .contact-link:hover { 
            background-color: #d4af37;
            color: #080808;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>HaShira</h1>
        <h2>The Song that was never silent</h2>
        
        <div class="status">Digital Platform Under Reconstruction</div>
        
        <a href="mailto:gli.biz@outlook.com" class="contact-link">Contact Project Lead</a>
    </div>
</body>
</html>
