<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HaShira</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: #0e0e0e;
      color: #eaeaea;
      font-family: Georgia, serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      margin: 0;
    }
    .container {
      max-width: 700px;
      padding: 30px;
    }
    h1 {
      font-size: 2.6em;
      letter-spacing: 0.06em;
      margin-bottom: 0.4em;
    }
    p {
      font-size: 1.15em;
      line-height: 1.65;
      margin: 0.6em 0;
      opacity: 0.9;
    }
    .small {
      margin-top: 2.2em;
      font-size: 0.9em;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>HaShira</h1>

    <p>The Torah was never meant to be silent.</p>

    <p>
      After centuries of silence,<br>
      we are beginning to hear<br>
      that the Torah was designed<br>
      not as prose, but as a grand song.
    </p>

    <p class="small">
      The gates of HaShira will open shortly.
    </p>
  </div>
</body>
</html>
